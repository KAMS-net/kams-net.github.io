<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 15px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .menu-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 2px solid transparent;
        }

        .menu-item:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .menu-item:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .menu-item.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .menu-item.blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .menu-item.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .menu-item.red {
            background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
        }

        .icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .text {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
        }

        .input-section {
            margin-top: auto;
            padding-top: 20px;
        }

        .input-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            resize: none;
            outline: none;
            height: 60px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Bot Control</h1>
        <p>Selecciona una opción y envía tus datos</p>
    </div>

    <div class="main-content">
        <div class="menu-grid">
            <div class="menu-item green" onclick="selectOption('START TRENDING ✨')">
                <span class="icon">✨</span>
                <span class="text">START TRENDING ✨</span>
            </div>
            <div class="menu-item orange" onclick="selectOption('Claim airdrop 🎁')">
                <span class="icon">🎁</span>
                <span class="text">Claim airdrop 🎁</span>
            </div>
            <div class="menu-item blue" onclick="selectOption('VOLUME BOOST ✏️')">
                <span class="icon">✏️</span>
                <span class="text">VOLUME BOOST ✏️</span>
            </div>
            <div class="menu-item red" onclick="selectOption('DEPOSIT WALLET 💰')">
                <span class="icon">💰</span>
                <span class="text">DEPOSIT WALLET 💰</span>
            </div>
        </div>

        <div class="input-section">
            <div class="input-area">
                <textarea id="messageInput" placeholder="Escribe aquí... (o selecciona una opción arriba)"></textarea>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="attachFile()">
                    📎 Adjuntar
                </button>
                <button class="btn btn-primary" onclick="sendData()">
                    Enviar 🚀
                </button>
            </div>
