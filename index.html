<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #15161b;
            --card: #1b1d28;
            --card-active: #232633;
            --border: #2a2d3a;
            --green: #86efac;
            --text: #ffffff;
            --muted: #9ca3af;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--green);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand h2 {
            margin: 0;
        }

        .pump-logo {
            width: 32px;
            height: 32px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .menu-item {
            background-color: var(--card);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            border: 1px solid var(--border);
        }

        .menu-item:hover {
            border-color: var(--green);
        }

        .menu-item:active {
            background-color: var(--card-active);
            transform: scale(0.98);
        }

        .icon {
            margin: 0 auto 8px;
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .text {
            font-weight: bold;
            font-size: 14px;
            display: block;
        }

        #input-area {
            margin-top: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text);
            resize: none;
            height: 80px;
            outline: none;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        textarea:focus {
            border-color: var(--green);
        }

        button.send-btn {
            background: var(--green);
            color: #0b0c10;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: filter 0.2s;
        }

        button.send-btn:hover {
            filter: brightness(1.08);
        }
    </style>
</head>
<body>

    <div class="brand">
        <svg class="pump-logo" viewBox="0 0 64 64" aria-label="pump.fun">
            <g transform="rotate(-45 32 32)">
                <path d="M32 14 H20 a18 18 0 0 0 0 36 H32 Z" fill="#ffffff"/>
                <path d="M32 14 H44 a18 18 0 0 1 0 36 H32 Z" fill="#86efac"/>
                <rect x="2" y="14" width="60" height="36" rx="18" fill="none" stroke="#0b0c10" stroke-width="4"/>
                <line x1="32" y1="14" x2="32" y2="50" stroke="#0b0c10" stroke-width="4"/>
                <path d="M12 26 a8 8 0 0 1 8 -6" fill="none" stroke="#0b0c10" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
            </g>
        </svg>
        <h2>Main Menu</h2>
    </div>

    <div class="menu-grid">
        <div class="menu-item" onclick="selectOption('START TRENDING ✨')">
            <span class="icon"><svg viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>
            <span class="text">START TRENDING</span>
        </div>
        <div class="menu-item" onclick="selectOption('Claim airdrop 🎁')">
            <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></span>
            <span class="text">Claim airdrop</span>
        </div>
        <div class="menu-item" onclick="selectOption('VOLUME BOOST ✏️')">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-4"/><path d="M13 17V9"/><path d="M18 17V5"/></svg></span>
            <span class="text">VOLUME BOOST</span>
        </div>
        <div class="menu-item" onclick="selectOption('DEPOSIT WALLET 💰')">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>
            <span class="text">DEPOSIT WALLET</span>
        </div>
    </div>

    <div id="input-area">
        <textarea id="user-text" placeholder="Type here or upload a photo..."></textarea>
        <button class="send-btn" onclick="sendData()">Send</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        tg.expand();

        function selectOption(option) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            
            document.getElementById('user-text').value = option;
            
            tg.showPopup({
                title: 'Option selected',
                message: `You selected: ${option}`,
                buttons: [{type: 'ok'}]
            });
        }

        function sendData() {
            const text = document.getElementById('user-text').value;
            
            if (text.trim() === "") {
                tg.showAlert("Please type something or select an option.");
                return;
            }

            tg.sendData(text);
        }
    </script>
</body>
</html>
